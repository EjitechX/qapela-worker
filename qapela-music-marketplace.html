<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Qapela — Unreleased Music</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
  :root{
    --primary:#0B5CFF; --secondary:#0E2A6B; --accent:#F5B301; --neutral:#F8FAFF;
    --bg:#F8FAFF; --card:#FFFFFF; --line:#E6EAF2;
    --text:#1B2559; --muted:#6B7590; --green:#16A34A; --danger:#DC2626;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,-apple-system,sans-serif; max-width:460px; margin-left:auto; margin-right:auto; min-height:100vh; padding-bottom:30px;}
  svg.ic{width:1em; height:1em; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vertical-align:-0.15em;}

  header.topbar{background:var(--secondary); color:#fff; padding:16px 18px 20px; border-radius:0 0 20px 20px;}
  .topbar-row{display:flex; align-items:center; justify-content:space-between;}
  .brand{display:flex; align-items:center; gap:9px; font-weight:800; font-size:16px;}
  .logo-mark{width:26px; height:26px; border-radius:7px; flex-shrink:0; background:linear-gradient(135deg,var(--primary),var(--accent)); display:flex; align-items:center; justify-content:center;}
  header p{font-size:12px; color:#B9C4E5; margin:8px 0 0;}

  .tabs{display:flex; gap:6px; padding:14px 16px 0;}
  .tab{flex:1; text-align:center; padding:9px; border-radius:10px; font-size:12.5px; font-weight:700; color:var(--muted); background:var(--card); border:1px solid var(--line); cursor:pointer;}
  .tab.active{background:var(--primary); color:#fff; border-color:var(--primary);}

  main{padding:14px 16px;}
  .view{display:none;}
  .view.active{display:block;}

  .song-card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:15px; margin-bottom:12px;}
  .song-card h3{margin:0 0 3px; font-size:14.5px;}
  .artist{font-size:12px; color:var(--primary); font-weight:600; margin-bottom:6px;}
  .song-card p{margin:0 0 12px; font-size:12px; color:var(--muted); line-height:1.4;}
  .price-tag{font-size:15px; font-weight:800; color:var(--secondary); margin-bottom:10px;}
  .btn{width:100%; background:var(--primary); color:#fff; border:none; padding:11px; border-radius:9px; font-weight:700; font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;}
  .btn:disabled{background:var(--line); color:var(--muted);}
  .btn.owned{background:var(--green);}
  .spinner{width:14px; height:14px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:30px 10px;}
  .msg{font-size:12px; margin-top:8px; padding:8px 10px; border-radius:8px;}
  .msg.err{background:rgba(220,38,38,.08); color:var(--danger);}
  audio{width:100%; margin-top:10px;}
  .hidden{display:none;}
</style>
<link rel="stylesheet" href="assets/qapela-theme.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute">
<defs><symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></symbol></defs>
</svg>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <div class="logo-mark"><img class="qapela-logo-img" src="assets/qapela-logo-icon.png" alt="Qapela mark" style="width:15px;height:15px;"></div>
        Unreleased Music
      </div>
    </div>
    <p>Hear it before it's out anywhere else — pay the artist directly.</p>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="browse" onclick="setTab('browse')">Browse</div>
    <div class="tab" data-tab="library" onclick="setTab('library')">My Library</div>
    <div class="tab" onclick="window.location.href='qapela-musician.html'">I'm an Artist</div>
  </div>

  <main>
    <div class="view active" id="view-browse">
      <div id="browseList"><div class="empty">Loading…</div></div>
    </div>
    <div class="view" id="view-library">
      <div id="libraryList"><div class="empty">Loading…</div></div>
    </div>
  </main>
</div>

<script>
  const API_BASE = "https://capella-api-5c6c.drthankgod08.workers.dev";
  let PAYSTACK_PUBLIC_KEY = ""; // loaded from the API (set once in Cloudflare), never hard-coded here
  fetch(API_BASE + "/public/settings").then(function (r) { return r.json(); }).then(function (d) { PAYSTACK_PUBLIC_KEY = d.paystackPublicKey || ""; }).catch(function () {});

  let currentUser = null;
  let purchasedSongIds = new Set();

  async function apiFetch(path, options = {}) {
    const res = await fetch(API_BASE + path, {
      ...options,
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + localStorage.getItem("qapela_token"), ...(options.headers || {}) },
    });
    const renewed = res.headers.get("X-Renewed-Token");
    if (renewed) localStorage.setItem("qapela_token", renewed);
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, data };
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, s => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[s]));
  }

  async function init() {
    const token = localStorage.getItem("qapela_token");
    if (!token) { window.location.href = "qapela-login.html"; return; }

    const me = await apiFetch("/auth/me");
    if (!me.ok) { window.location.href = "qapela-login.html"; return; }
    currentUser = me.data;

    document.getElementById("app").classList.remove("hidden");
    loadBrowse();
    loadLibrary();
  }

  window.setTab = function (tab) {
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === tab));
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    document.getElementById("view-" + tab).classList.add("active");
  };

  async function loadBrowse() {
    const el = document.getElementById("browseList");
    const { ok, data } = await apiFetch("/music/songs");
    if (!ok) { el.innerHTML = `<div class="empty">Could not load: ${escapeHtml(data.message || "")}</div>`; return; }

    const songs = data.songs || [];
    purchasedSongIds = new Set(data.myPurchasedSongIds || []);
    if (songs.length === 0) { el.innerHTML = '<div class="empty">No unreleased tracks right now — check back soon.</div>'; return; }

    el.innerHTML = songs.map(s => {
      const owned = purchasedSongIds.has(s.id);
      return `
        <div class="song-card">
          <h3>${escapeHtml(s.title)}</h3>
          <div class="artist">${escapeHtml(s.artistName || "Unknown artist")}</div>
          <p>${escapeHtml(s.description || "")}</p>
          <div class="price-tag">₦${s.price.toLocaleString()}</div>
          ${owned
            ? `<button class="btn owned" disabled><svg class="ic"><use href="#i-check"/></svg> Unlocked — see My Library</button>`
            : `<button class="btn" id="buy-${s.id}" onclick="buySong('${s.id}', ${s.price})">Unlock for ₦${s.price.toLocaleString()}</button>`
          }
          <div id="buyMsg-${s.id}"></div>
        </div>
      `;
    }).join("");
  }

  window.buySong = function (songId, price) {
    if (!PAYSTACK_PUBLIC_KEY) { alert("Payments are temporarily unavailable. Please try again shortly."); return; }
    const btn = document.getElementById("buy-" + songId);
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Opening secure checkout…';

    const reference = "QAP-MUSIC-" + songId.slice(0, 6) + "-" + Date.now();

    const handler = PaystackPop.setup({
      key: PAYSTACK_PUBLIC_KEY,
      email: currentUser.email || (currentUser.phone + "@qapela.placeholder"),
      amount: price * 100,
      currency: "NGN",
      ref: reference,
      metadata: { fanId: currentUser.uid, songId },
      callback: function (response) {
        btn.innerHTML = '<span class="spinner"></span> Verifying…';
        apiFetch("/music/purchase", { method: "POST", body: JSON.stringify({ reference: response.reference, songId }) })
          .then(({ ok, data }) => {
            const msgEl = document.getElementById("buyMsg-" + songId);
            if (ok && data.success) { loadBrowse(); loadLibrary(); }
            else {
              msgEl.innerHTML = `<div class="msg err">${escapeHtml(data.message || "Verification failed.")}</div>`;
              btn.disabled = false;
              btn.textContent = `Unlock for ₦${price.toLocaleString()}`;
            }
          })
          .catch(() => {
            document.getElementById("buyMsg-" + songId).innerHTML = `<div class="msg err">Could not verify. Contact support with reference: ${reference}</div>`;
            btn.disabled = false;
          });
      },
      onClose: function () {
        btn.disabled = false;
        btn.textContent = `Unlock for ₦${price.toLocaleString()}`;
      }
    });
    handler.openIframe();
  };

  async function loadLibrary() {
    const el = document.getElementById("libraryList");
    const { ok, data } = await apiFetch("/music/library");
    if (!ok) { el.innerHTML = `<div class="empty">Could not load: ${escapeHtml(data.message || "")}</div>`; return; }

    const purchases = data.purchases || [];
    if (purchases.length === 0) { el.innerHTML = '<div class="empty">Nothing unlocked yet — browse tracks to get started.</div>'; return; }

    el.innerHTML = purchases.map(p => `
      <div class="song-card">
        <h3>${escapeHtml(p.title)}</h3>
        <div class="artist">${escapeHtml(p.artistName || "Unknown artist")}</div>
        <button class="btn" onclick="playSong('${p.songId}', this)">▶ Play</button>
        <div id="player-${p.songId}"></div>
      </div>
    `).join("");
  }

  window.playSong = async function (songId, btn) {
    const container = document.getElementById("player-" + songId);
    if (container.querySelector("audio")) return; // already loaded
    btn.disabled = true;
    btn.textContent = "Loading…";

    try {
      const res = await fetch(API_BASE + "/music/file/" + songId, {
        headers: { Authorization: "Bearer " + localStorage.getItem("qapela_token") },
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        container.innerHTML = `<div class="msg err">${escapeHtml(data.message || "Could not load audio.")}</div>`;
        btn.disabled = false;
        btn.textContent = "▶ Play";
        return;
      }
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      container.innerHTML = `<audio controls autoplay src="${url}"></audio>`;
      btn.style.display = "none";
    } catch (err) {
      container.innerHTML = '<div class="msg err">Could not load audio.</div>';
      btn.disabled = false;
      btn.textContent = "▶ Play";
    }
  };

  init();
</script>

</body>
</html>
