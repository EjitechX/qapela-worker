<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Qapela — Checkout</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
  :root{
    --primary:#0B5CFF; --secondary:#0E2A6B; --accent:#F5B301; --neutral:#F8FAFF;
    --bg:#F4F7FC; --card:#FFFFFF; --line:#E2E8F2;
    --text:#14204A; --muted:#68738D; --green:#16A34A; --danger:#DC2626;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,-apple-system,sans-serif; max-width:420px; margin-left:auto; margin-right:auto; min-height:100vh;}
  svg.ic{width:1em; height:1em; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vertical-align:-0.15em;}

  header{background:var(--secondary); color:#fff; padding:22px 20px; border-radius:0 0 20px 20px; text-align:center;}
  .logo-mark{width:40px; height:40px; border-radius:11px; margin:0 auto 10px; background:#011650; overflow:hidden; display:flex; align-items:center; justify-content:center;}
  header p{margin:0; font-size:11.5px; color:#B9C4E5;}

  main{padding:20px 18px 40px;}

  .product-card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; text-align:center;}
  .product-card h1{font-size:18px; margin:0 0 8px; font-weight:800; color:var(--secondary);}
  .product-card p{font-size:13px; color:var(--muted); line-height:1.5; margin:0 0 18px;}
  .price{font-size:32px; font-weight:800; color:var(--text); margin-bottom:4px;}
  .price-sub{font-size:11.5px; color:var(--muted); margin-bottom:20px;}

  .field{margin:16px 0; text-align:left;}
  .field label{display:block; font-size:12px; font-weight:700; margin-bottom:6px;}
  .field input{width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:9px; font-size:13.5px; box-sizing:border-box;}

  .btn{width:100%; background:var(--primary); color:#fff; border:none; padding:14px; border-radius:12px; font-weight:700; font-size:14.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;}
  .btn:disabled{background:var(--line); color:var(--muted);}
  .spinner{width:16px; height:16px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .state-box{text-align:center; padding:50px 16px;}
  .state-icon{width:60px; height:60px; border-radius:50%; margin:0 auto 16px; display:flex; align-items:center; justify-content:center;}
  .state-icon.success{background:#DCFCE7; color:var(--green);}
  .state-icon.error{background:rgba(220,38,38,.1); color:var(--danger);}
  .state-icon svg{width:30px; height:30px;}
  .state-box h2{font-size:17px; margin:0 0 8px;}
  .state-box p{font-size:13px; color:var(--muted); line-height:1.5;}

  .fine-print{font-size:11px; color:var(--muted); text-align:center; margin-top:16px; line-height:1.5;}
  .hidden{display:none;}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
<defs>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.6-4.6 4.1 1.3 6-5.4-3.1L6.6 19.3l1.3-6-4.6-4.1 6.1-.6L12 3z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
</defs>
</svg>

<header>
  <div class="logo-mark"><img src="assets/qapela-logo-icon.png" alt="Qapela" style="width:100%;height:100%;object-fit:contain;display:block;"></div>
  <p>Secure checkout powered by Qapela</p>
</header>

<main id="mainContent">
  <div class="state-box"><p>Loading…</p></div>
</main>

<script>
  const API_BASE = "https://capella-api-5c6c.drthankgod08.workers.dev";
  let PAYSTACK_PUBLIC_KEY = ""; // loaded from the API (set once in Cloudflare), never hard-coded here
  fetch(API_BASE + "/public/settings").then(function (r) { return r.json(); }).then(function (d) { PAYSTACK_PUBLIC_KEY = d.paystackPublicKey || ""; }).catch(function () {});

  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  let product = null;

  async function init() {
    const main = document.getElementById("mainContent");
    if (!code) {
      main.innerHTML = `<div class="state-box"><div class="state-icon error"><svg class="ic"><use href="#i-x"/></svg></div><h2>Invalid link</h2><p>This checkout link is missing its product code.</p></div>`;
      return;
    }

    try {
      const res = await fetch(API_BASE + "/affiliate/checkout/" + encodeURIComponent(code));
      const data = await res.json();
      if (!res.ok) {
        main.innerHTML = `<div class="state-box"><div class="state-icon error"><svg class="ic"><use href="#i-x"/></svg></div><h2>Not available</h2><p>${escapeHtml(data.message || "This link is no longer valid.")}</p></div>`;
        return;
      }
      product = data;
      renderProduct();
    } catch (err) {
      main.innerHTML = `<div class="state-box"><div class="state-icon error"><svg class="ic"><use href="#i-x"/></svg></div><h2>Something went wrong</h2><p>Check your connection and try again.</p></div>`;
    }
  }

  function renderProduct() {
    document.getElementById("mainContent").innerHTML = `
      <div class="product-card">
        <h1>${escapeHtml(product.title)}</h1>
        <p>${escapeHtml(product.description || "")}</p>
        <div class="price">₦${product.price.toLocaleString()}</div>
        <div class="price-sub">One-time payment</div>

        <div class="field"><label>Your Email</label><input type="email" id="buyerEmail" placeholder="you@example.com"></div>

        <button class="btn" id="payBtn" onclick="payNow()">Pay ₦${product.price.toLocaleString()}</button>
      </div>
      <p class="fine-print"><svg class="ic"><use href="#i-lock"/></svg> Secure payment.</p>
    `;
  }

  window.payNow = function () {
    const email = document.getElementById("buyerEmail").value.trim();
    if (!email || !email.includes("@")) { alert("Enter a valid email — your receipt goes here."); return; }

    if (!PAYSTACK_PUBLIC_KEY) { alert("Payments are temporarily unavailable. Please try again shortly."); return; }
    const btn = document.getElementById("payBtn");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Opening secure checkout…';

    const reference = "QAP-AFF-" + code + "-" + Date.now();

    const handler = PaystackPop.setup({
      key: PAYSTACK_PUBLIC_KEY,
      email: email,
      amount: product.price * 100,
      currency: "NGN",
      ref: reference,
      metadata: { affiliateCode: code, purpose: "affiliate_purchase" },
      callback: function (response) {
        showVerifying();
        fetch(API_BASE + "/affiliate/purchase", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ reference: response.reference, code }),
        })
          .then(r => r.json())
          .then(data => {
            if (data.success) showSuccess();
            else showError(data.message || "Verification failed.");
          })
          .catch(() => showError("Could not verify payment. Contact support with reference: " + reference));
      },
      onClose: function () {
        btn.disabled = false;
        btn.innerHTML = `Pay ₦${product.price.toLocaleString()}`;
      }
    });
    handler.openIframe();
  };

  function showVerifying() {
    document.getElementById("mainContent").innerHTML = `<div class="state-box"><p>Verifying payment…</p></div>`;
  }
  function showSuccess() {
    document.getElementById("mainContent").innerHTML = `
      <div class="state-box">
        <div class="state-icon success"><svg class="ic"><use href="#i-check"/></svg></div>
        <h2>Payment successful</h2>
        <p>Thank you for your purchase. A receipt has been sent to your email.</p>
      </div>
    `;
  }
  function showError(message) {
    document.getElementById("mainContent").innerHTML = `
      <div class="state-box">
        <div class="state-icon error"><svg class="ic"><use href="#i-x"/></svg></div>
        <h2>Payment issue</h2>
        <p>${escapeHtml(message)}</p>
      </div>
    `;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, s => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[s]));
  }

  init();
</script>

</body>
</html>
