<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<!-- qapela-og -->
<meta name="description" content="Sign in to your Qapela account.">
<meta name="theme-color" content="#0E2A6B">
<link rel="icon" type="image/png" href="assets/qapela-logo-icon.png">
<link rel="apple-touch-icon" href="assets/qapela-logo-icon.png">
<meta property="og:site_name" content="Qapela">
<meta property="og:type" content="website">
<meta property="og:title" content="Qapela — Sign In">
<meta property="og:description" content="Sign in to your Qapela account.">
<meta property="og:url" content="https://ejitechx.github.io/qapela-worker/qapela-login.html">
<meta property="og:image" content="https://ejitechx.github.io/qapela-worker/assets/qapela-share.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Qapela — Work. Earn. Grow.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Qapela — Sign In">
<meta name="twitter:description" content="Sign in to your Qapela account.">
<meta name="twitter:image" content="https://ejitechx.github.io/qapela-worker/assets/qapela-share.jpg">

<script src="assets/qapela-session.js"></script>
<title>Qapela — Sign In</title>
<style>
  :root{
    --primary:#0B5CFF; --secondary:#0E2A6B; --accent:#F5B301; --neutral:#F8FAFF;
    --bg:#F4F7FC; --card:#FFFFFF; --line:#E2E8F2;
    --text:#14204A; --muted:#68738D; --danger:#DC2626; --green:#16A34A;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,-apple-system,sans-serif; max-width:420px; margin-left:auto; margin-right:auto; min-height:100vh;}
  svg.ic{width:1em; height:1em; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vertical-align:-0.15em;}

  header{background:var(--secondary); color:#fff; padding:24px 20px; border-radius:0 0 20px 20px; text-align:center;}
  .logo-mark{width:44px; height:44px; border-radius:12px; margin:0 auto 12px; background:linear-gradient(135deg,var(--primary),var(--accent)); display:flex; align-items:center; justify-content:center;}
  .logo-mark svg{width:24px; height:24px; stroke:#fff; stroke-width:2.2;}
  header h1{font-size:19px; margin:0 0 4px; font-weight:800;}
  header p{margin:0; font-size:12.5px; color:#B9C4E5;}

  main{padding:24px 18px 40px;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:700; margin-bottom:6px;}
  .field input{width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:9px; font-size:13.5px; box-sizing:border-box;}
  .password-wrap{position:relative;}
  .password-wrap input{padding-right:42px;}
  .eye-btn{position:absolute; right:2px; top:0; bottom:0; margin:auto; height:34px; width:34px; background:none; border:none; padding:0; cursor:pointer; color:var(--muted); display:flex; align-items:center; justify-content:center;}
  .eye-btn:hover{color:var(--text);}

  .btn{width:100%; background:var(--primary); color:#fff; border:none; padding:13px; border-radius:11px; font-weight:700; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:8px;}
  .btn:disabled{background:var(--line); color:var(--muted); cursor:default;}
  .spinner{width:15px; height:15px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .msg{font-size:12.5px; margin-top:10px; padding:10px 12px; border-radius:9px; background:rgba(220,38,38,.08); color:var(--danger); border:1px solid rgba(220,38,38,.2); display:none;}
  .msg.show{display:block;}

  .switch{text-align:center; margin-top:18px; font-size:12.5px; color:var(--muted);}
  .switch a{color:var(--primary); font-weight:700; text-decoration:none;}
</style>
<link rel="stylesheet" href="assets/qapela-theme.css">
</head>
<body>

<header>
  <div class="logo-mark"><img class="qapela-logo-img" src="assets/qapela-logo-icon.png" alt="Qapela"></div>
  <h1>Welcome back</h1>
  <p>Sign in to your Qapela account</p>
</header>

<main>
  <div class="field"><label>Email or Phone</label><input type="text" id="f-identifier" placeholder="you@example.com" autocapitalize="off"></div>
  <div class="field"><label>Password</label>
    <div class="password-wrap">
      <input type="password" id="f-password" placeholder="Your password">
      <button type="button" class="eye-btn" onclick="togglePasswordVisibility('f-password', this)" aria-label="Show password">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </div>
  <div style="text-align:right; margin-top:-10px; margin-bottom:16px;">
    <a href="qapela-forgot-password.html" style="font-size:12px; color:var(--primary); text-decoration:none; font-weight:600;">Forgot password?</a>
  </div>

  <div class="msg" id="loginMsg"></div>

  <button class="btn" id="loginBtn" onclick="doLogin()">Sign In</button>

  <div class="switch">New to Qapela?
    <a href="qapela-signup.html">Create an account</a>
  </div>
</main>

<script>
  const EYE_OPEN_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
  const EYE_SLASH_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 10.6a3 3 0 0 0 4.2 4.2"/><path d="M9.9 4.24A10.6 10.6 0 0 1 12 4c7 0 11 7 11 7a13.2 13.2 0 0 1-3.4 4.15M6.6 6.6C3.7 8.4 1 12 1 12s4 7 11 7a10.7 10.7 0 0 0 4-.76"/></svg>';

  window.togglePasswordVisibility = function (inputId, btn) {
    const input = document.getElementById(inputId);
    const nowShowing = input.type === "password";
    input.type = nowShowing ? "text" : "password";
    btn.innerHTML = nowShowing ? EYE_SLASH_SVG : EYE_OPEN_SVG;
    btn.setAttribute("aria-label", nowShowing ? "Hide password" : "Show password");
  };
  // ── Your Worker's URL — update this if you ever redeploy to a
  // different subdomain or a custom domain. ──
  const API_BASE = "https://capella-api-5c6c.drthankgod08.workers.dev";

  window.doLogin = async function () {
    const msgEl = document.getElementById("loginMsg");
    msgEl.classList.remove("show");

    const identifier = document.getElementById("f-identifier").value.trim();
    const password = document.getElementById("f-password").value;

    if (!identifier || !password) {
      msgEl.textContent = "Enter your email/phone and password.";
      msgEl.classList.add("show");
      return;
    }

    const btn = document.getElementById("loginBtn");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Signing in…';

    try {
      const res = await fetch(API_BASE + "/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionPolicy: localStorage.getItem("qapela_session_policy") || "6m", identifier, password }),
      });
      const data = await res.json();

      if (!res.ok || !data.success) {
        msgEl.textContent = data.message || "Could not sign in.";
        msgEl.classList.add("show");
        btn.disabled = false;
        btn.textContent = "Sign In";
        return;
      }

      localStorage.setItem("qapela_token", data.token);
      localStorage.setItem("qapela_uid", data.uid);
      if (data.profile) {
        localStorage.setItem("qapela_profile", JSON.stringify(data.profile));
        const artistOnly = data.profile.roleMusician && !data.profile.roleWorker && !data.profile.roleBusiness;
        if (!data.profile.accountActivated) {
          const role = artistOnly ? "artist" : data.profile.roleBusiness && !data.profile.roleWorker ? "business" : "worker";
          window.location.href = "qapela-activation.html?role=" + role;
          return;
        }
        // Artist-only accounts land in the studio.
        if (artistOnly) {
          window.location.href = "qapela-musician.html";
          return;
        }
        // Send them to whichever dashboard matches their account — a
        // business-only account goes to the business dashboard, otherwise
        // worker (an account can hold both; worker is the default view).
        if (data.profile.roleBusiness && !data.profile.roleWorker) {
          window.location.href = "qapela-business.html";
        } else {
          window.location.href = "qapela-worker.html";
        }
      } else {
        window.location.href = "qapela-worker.html";
      }
    } catch (err) {
      msgEl.textContent = "Could not reach Qapela's servers — check your connection and try again.";
      msgEl.classList.add("show");
      btn.disabled = false;
      btn.textContent = "Sign In";
    }
  };
</script>

<script src="assets/qapela-help.js" defer></script>
</body>
</html>
