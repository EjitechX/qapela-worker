<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Qapela — Profile</title>
<style>
  :root{
    --primary:#0B5CFF; --secondary:#0E2A6B; --accent:#F5B301; --neutral:#F8FAFF;
    --bg:#F8FAFF; --card:#FFFFFF; --line:#E6EAF2;
    --text:#1B2559; --muted:#6B7590; --green:#16A34A; --danger:#DC2626;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,-apple-system,sans-serif; max-width:420px; margin-left:auto; margin-right:auto; min-height:100vh; padding-bottom:24px;}
  svg.ic{width:1em; height:1em; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vertical-align:-0.15em;}

  header.topbar{background:var(--secondary); color:#fff; padding:16px 18px 20px; border-radius:0 0 20px 20px;}
  .topbar-row{display:flex; align-items:center; gap:10px;}
  .back{font-size:19px; color:#fff; cursor:pointer;}
  .brand{display:flex; align-items:center; gap:9px; font-weight:800; font-size:16px;}
  .logo-mark{width:26px; height:26px; border-radius:7px; flex-shrink:0; background:linear-gradient(135deg,var(--primary),var(--accent)); display:flex; align-items:center; justify-content:center;}

  main{padding:16px;}

  .profile-card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; text-align:center; margin-bottom:16px;}
  .avatar-big{width:64px; height:64px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:800; margin:0 auto 12px;}
  .profile-card h2{font-size:16px; margin:0 0 3px;}
  .profile-card p{font-size:12.5px; color:var(--muted); margin:0;}

  .stats-row{display:flex; gap:10px; margin-bottom:16px;}
  .stat-card{flex:1; background:var(--card); border:1px solid var(--line); border-radius:13px; padding:12px; text-align:center;}
  .stat-card .value{font-size:17px; font-weight:800; color:var(--secondary);}
  .stat-card .label{font-size:10px; color:var(--muted); font-weight:700; text-transform:uppercase; margin-top:4px;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px;}
  .card h3{font-size:13.5px; margin:0 0 12px; font-weight:700;}
  .field{margin-bottom:13px;}
  .field label{display:block; font-size:12px; font-weight:700; margin-bottom:6px;}
  .field input{width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:9px; font-size:13.5px; box-sizing:border-box;}
  .field input:disabled{background:var(--neutral); color:var(--muted);}
  .btn{width:100%; background:var(--primary); color:#fff; border:none; padding:12px; border-radius:10px; font-weight:700; font-size:13.5px; cursor:pointer;}
  .btn:disabled{background:var(--line); color:var(--muted);}
  .msg{font-size:12px; margin-top:10px; padding:9px 11px; border-radius:8px;}
  .msg.ok{background:rgba(22,163,74,.08); color:var(--green);}
  .msg.err{background:rgba(220,38,38,.08); color:var(--danger);}

  .kyc-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .kyc-row:last-child{border-bottom:none;}
  .badge{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px;}
  .badge.none{background:var(--neutral); color:var(--muted); border:1px solid var(--line);}
  .badge.pending{background:#FEF3C7; color:#92400E;}
  .badge.verified{background:rgba(22,163,74,.12); color:var(--green);}

  .signout-btn{width:100%; background:#fff; color:var(--danger); border:1px solid var(--danger); padding:12px; border-radius:10px; font-weight:700; font-size:13.5px; cursor:pointer; margin-top:6px;}
  .hidden{display:none;}
</style>
<link rel="stylesheet" href="assets/qapela-theme.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute">
<defs><symbol id="i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol></defs>
</svg>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="topbar-row">
      <span class="back" onclick="history.back()"><svg class="ic"><use href="#i-back"/></svg></span>
      <div class="brand">
        <div class="logo-mark"><img class="qapela-logo-img" src="assets/qapela-logo-icon.png" alt="Qapela mark" style="width:15px;height:15px;"></div>
        Profile
      </div>
    </div>
  </header>

  <main>
    <div class="profile-card">
      <div class="avatar-big" id="avatarBig">?</div>
      <h2 id="profName">—</h2>
      <p id="profEmail">—</p>
    </div>

    <div class="stats-row">
      <div class="stat-card"><div class="value" id="statLevel">1</div><div class="label">Level</div></div>
      <div class="stat-card"><div class="value" id="statCompleted">0</div><div class="label">Completed</div></div>
      <div class="stat-card"><div class="value" id="statSuccess">100%</div><div class="label">Success Rate</div></div>
    </div>

    <div class="card">
      <h3>Edit Profile</h3>
      <div class="field"><label>Full Name</label><input type="text" id="f-name"></div>
      <div class="field"><label>Email</label><input type="text" id="f-email" disabled></div>
      <button class="btn" id="saveBtn" onclick="saveProfile()">Save Changes</button>
      <div id="saveMsg"></div>
    </div>

    <div class="card">
      <h3>Verification Status</h3>
      <div class="kyc-row"><span>KYC Status</span><span class="badge" id="kycBadge">—</span></div>
      <div class="kyc-row"><span>Worker Access Activated</span><span class="badge" id="activatedBadge">—</span></div>
      <div class="kyc-row"><span>Business Access</span><span class="badge" id="businessAccessBadge">—</span></div>
    </div>

    <div class="card" id="switchCard" style="display:none;">
      <h3>Also Manage a Business</h3>
      <p style="font-size:12.5px; color:var(--muted); margin:0 0 12px;">Launch campaigns on this same account.</p>
      <button class="btn" onclick="switchToBusiness()">Switch to Business</button>
    </div>

    <button class="btn" style="margin-bottom:10px;" onclick="window.location.href='qapela-account.html'">Account settings</button>
    <button class="signout-btn" onclick="doSignOut()">Sign Out</button>
  </main>
</div>

<script>
  const API_BASE = "https://capella-api-5c6c.drthankgod08.workers.dev";

  async function apiFetch(path, options = {}) {
    const res = await fetch(API_BASE + path, {
      ...options,
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + localStorage.getItem("qapela_token"), ...(options.headers || {}) },
    });
    const renewed = res.headers.get("X-Renewed-Token");
    if (renewed) localStorage.setItem("qapela_token", renewed);
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, data };
  }

  window.doSignOut = function () {
    localStorage.removeItem("qapela_token");
    localStorage.removeItem("qapela_uid");
    window.location.href = "qapela-login.html";
  };

  window.switchToBusiness = async function () {
    await apiFetch("/account/roles", { method: "POST", body: JSON.stringify({ role: "business" }) });
    window.location.href = "qapela-business.html";
  };

  async function init() {
    const token = localStorage.getItem("qapela_token");
    if (!token) { window.location.href = "qapela-login.html"; return; }

    const me = await apiFetch("/auth/me");
    if (!me.ok) { doSignOut(); return; }

    document.getElementById("app").classList.remove("hidden");
    renderProfile(me.data);

    const profRes = await apiFetch("/worker-profile/mine");
    if (profRes.ok) renderWorkerStats(profRes.data);
  }

  function renderProfile(u) {
    const name = u.displayName || "—";
    document.getElementById("profName").textContent = name;
    document.getElementById("profEmail").textContent = u.email || u.phone || "—";
    document.getElementById("avatarBig").textContent = (u.displayName || "?").charAt(0).toUpperCase();
    document.getElementById("f-name").value = u.displayName || "";
    document.getElementById("f-email").value = u.email || u.phone || "";

    document.getElementById("activatedBadge").textContent = u.workerActivated ? "Yes" : "No";
    document.getElementById("activatedBadge").className = "badge " + (u.workerActivated ? "verified" : "none");

    const businessBadge = document.getElementById("businessAccessBadge");
    businessBadge.textContent = u.roleBusiness ? (u.businessActivated ? "Active" : "Set up, not activated") : "Not set up";
    businessBadge.className = "badge " + (u.businessActivated ? "verified" : "none");
    document.getElementById("switchCard").style.display = u.roleBusiness ? "none" : "block";
  }

  function renderWorkerStats(p) {
    document.getElementById("statLevel").textContent = p.level || 1;
    document.getElementById("statCompleted").textContent = p.tasksCompleted || 0;
    document.getElementById("statSuccess").textContent = (p.successRatePct ?? 100) + "%";
    const kyc = p.kycStatus || "none";
    document.getElementById("kycBadge").textContent = kyc === "none" ? "Not started" : kyc;
    document.getElementById("kycBadge").className = "badge " + kyc;
  }

  window.saveProfile = async function () {
    const btn = document.getElementById("saveBtn");
    const msgEl = document.getElementById("saveMsg");
    const name = document.getElementById("f-name").value.trim();
    if (!name) {
      msgEl.innerHTML = '<div class="msg err">Name can\'t be empty.</div>';
      return;
    }
    btn.disabled = true;
    btn.textContent = "Saving…";

    const { ok, data } = await apiFetch("/account/profile", { method: "POST", body: JSON.stringify({ name }) });

    if (ok && data.success) {
      document.getElementById("profName").textContent = name;
      document.getElementById("avatarBig").textContent = name.charAt(0).toUpperCase();
      msgEl.innerHTML = '<div class="msg ok">Saved.</div>';
    } else {
      msgEl.innerHTML = `<div class="msg err">${data.message || "Could not save."}</div>`;
    }
    btn.disabled = false;
    btn.textContent = "Save Changes";
  };

  init();
</script>

</body>
</html>
