<!DOCTYPE html>
<html lang="en">
<head>

<title>Qapela — Reset Password</title>
<style>
  :root{
    --primary:#0B5CFF; --secondary:#0E2A6B; --accent:#F5B301; --neutral:#F8FAFF;
    --text:#1B2559; --muted:#6B7590; --line:#E6EAF2; --green:#16A34A; --danger:#DC2626;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--neutral); color:var(--text); font-family:'Segoe UI',system-ui,-apple-system,sans-serif; max-width:420px; margin-left:auto; margin-right:auto; min-height:100vh; display:flex; flex-direction:column;}
  svg.ic{width:1em; height:1em; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vertical-align:-0.15em;}

  header{background:var(--secondary); padding:18px; display:flex; align-items:center; gap:10px;}
  .brand{display:flex; align-items:center; gap:9px; font-weight:800; font-size:15px; color:#fff;}
  .logo-mark{width:24px; height:24px; border-radius:6px; flex-shrink:0; background:linear-gradient(135deg,var(--primary),var(--accent));}

  main{flex:1; padding:30px 24px;}
  .icon-badge{width:52px; height:52px; border-radius:50%; background:#EEF3FF; color:var(--primary); display:flex; align-items:center; justify-content:center; margin-bottom:18px;}
  h1{font-size:19px; margin:0 0 8px;}
  .sub{font-size:13.5px; color:var(--muted); margin:0 0 24px; line-height:1.5;}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; font-weight:700; margin-bottom:6px;}
  .field input{width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:10px; font-size:14px; box-sizing:border-box;}
  .password-wrap{position:relative;}
  .password-wrap input{padding-right:42px;}
  .eye-btn{position:absolute; right:2px; top:0; bottom:0; margin:auto; height:36px; width:36px; background:none; border:none; padding:0; cursor:pointer; color:var(--muted); display:flex; align-items:center; justify-content:center;}
  .eye-btn:hover{color:var(--text);}

  .btn{width:100%; background:var(--primary); color:#fff; border:none; padding:13px; border-radius:11px; font-weight:700; font-size:14px; cursor:pointer;}
  .btn:disabled{background:var(--line); color:var(--muted);}

  .result-box{text-align:center; padding:20px 10px;}
  .result-icon{width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 16px;}
  .result-icon.ok{background:#DCFCE7; color:var(--green);}
  .result-icon.err{background:rgba(220,38,38,.1); color:var(--danger);}
  .result-box h2{font-size:17px; margin:0 0 8px;}
  .result-box p{font-size:13.5px; color:var(--muted); line-height:1.5;}

  .msg{font-size:12.5px; margin-top:10px; color:var(--danger);}
  .back-link{display:block; text-align:center; margin-top:20px; font-size:13px; color:var(--primary); text-decoration:none; font-weight:600;}
  .hidden{display:none;}
  .qapela-wordmark{height:30px; width:auto; display:block;}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
<defs>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
</defs>
</svg>

<header>
  <div class="brand"><img class="qapela-wordmark" src="assets/qapela-wordmark.png" alt="Qapela"></div>
</header>

<main>
  <div id="formView" class="hidden">
    <div class="icon-badge"><svg class="ic" style="width:22px;height:22px;"><use href="#i-lock"/></svg></div>
    <h1>Set a new password</h1>
    <div class="sub">Choose a new password for your Qapela account.</div>

    <div class="field"><label>New Password</label>
      <div class="password-wrap">
        <input type="password" id="f-password" placeholder="At least 8 characters">
        <button type="button" class="eye-btn" onclick="togglePasswordVisibility('f-password', this)" aria-label="Show password">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <div class="field"><label>Confirm Password</label>
      <div class="password-wrap">
        <input type="password" id="f-confirm" placeholder="Retype your new password">
        <button type="button" class="eye-btn" onclick="togglePasswordVisibility('f-confirm', this)" aria-label="Show password">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <button class="btn" id="resetBtn" onclick="doReset()">Reset Password</button>
    <div class="msg" id="formMsg"></div>
  </div>

  <div id="invalidView" class="result-box hidden">
    <div class="result-icon err"><svg class="ic" style="width:26px;height:26px;"><use href="#i-x"/></svg></div>
    <h2>This link doesn't work</h2>
    <p>It may be missing its token, already used, or expired. Request a new one.</p>
    <a class="back-link" href="qapela-forgot-password.html">Request a New Link</a>
  </div>

  <div id="successView" class="result-box hidden">
    <div class="result-icon ok"><svg class="ic" style="width:26px;height:26px;"><use href="#i-check"/></svg></div>
    <h2>Password reset</h2>
    <p>You can now sign in with your new password.</p>
    <a class="back-link" href="qapela-login.html">Go to Sign In</a>
  </div>
</main>

<script>
  const EYE_OPEN_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
  const EYE_SLASH_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 10.6a3 3 0 0 0 4.2 4.2"/><path d="M9.9 4.24A10.6 10.6 0 0 1 12 4c7 0 11 7 11 7a13.2 13.2 0 0 1-3.4 4.15M6.6 6.6C3.7 8.4 1 12 1 12s4 7 11 7a10.7 10.7 0 0 0 4-.76"/></svg>';

  window.togglePasswordVisibility = function (inputId, btn) {
    const input = document.getElementById(inputId);
    const nowShowing = input.type === "password";
    input.type = nowShowing ? "text" : "password";
    btn.innerHTML = nowShowing ? EYE_SLASH_SVG : EYE_OPEN_SVG;
    btn.setAttribute("aria-label", nowShowing ? "Hide password" : "Show password");
  };

  const API_BASE = "https://capella-api-5c6c.drthankgod08.workers.dev";
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");

  function init() {
    if (!token) {
      document.getElementById("invalidView").classList.remove("hidden");
      return;
    }
    document.getElementById("formView").classList.remove("hidden");
  }

  window.doReset = async function () {
    const msgEl = document.getElementById("formMsg");
    msgEl.textContent = "";

    const password = document.getElementById("f-password").value;
    const confirm = document.getElementById("f-confirm").value;

    if (!password || password.length < 8) { msgEl.textContent = "Password must be at least 8 characters."; return; }
    if (password !== confirm) { msgEl.textContent = "Passwords don't match."; return; }

    const btn = document.getElementById("resetBtn");
    btn.disabled = true;
    btn.textContent = "Resetting…";

    try {
      const res = await fetch(API_BASE + "/auth/password-reset/confirm", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, newPassword: password }),
      });
      const data = await res.json();

      if (res.ok && data.success) {
        document.getElementById("formView").classList.add("hidden");
        document.getElementById("successView").classList.remove("hidden");
      } else {
        msgEl.textContent = data.message || "Could not reset password.";
        btn.disabled = false;
        btn.textContent = "Reset Password";
      }
    } catch (err) {
      msgEl.textContent = "Could not reach the server. Check your connection.";
      btn.disabled = false;
      btn.textContent = "Reset Password";
    }
  };

  init();
</script>

<script src="assets/qapela-help.js" defer></script>
</body>
</html>
