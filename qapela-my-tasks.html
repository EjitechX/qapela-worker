<title>Qapela — My Tasks</title>
<style>
  :root{
    --primary:#0B5CFF; --secondary:#0E2A6B; --accent:#F5B301; --neutral:#F8FAFF;
    --bg:#F8FAFF; --card:#FFFFFF; --line:#E6EAF2;
    --text:#1B2559; --muted:#6B7590; --green:#16A34A; --danger:#DC2626;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    max-width:420px; margin-left:auto; margin-right:auto; min-height:100vh; padding-bottom:24px;
  }
  svg.ic{width:1em; height:1em; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vertical-align:-0.15em;}

  header.topbar{background:var(--secondary); color:#fff; padding:16px 18px 20px; border-radius:0 0 20px 20px;}
  .topbar-row{display:flex; align-items:center; gap:10px;}
  .back{font-size:19px; color:#fff; cursor:pointer;}
  .brand{display:flex; align-items:center; gap:9px; font-weight:800; font-size:16px;}
  .logo-mark{width:26px; height:26px; border-radius:7px; flex-shrink:0; background:linear-gradient(135deg,var(--primary),var(--accent)); display:flex; align-items:center; justify-content:center;}

  .tabs{display:flex; gap:6px; padding:14px 16px 0;}
  .tab{flex:1; text-align:center; padding:9px; border-radius:10px; font-size:12.5px; font-weight:700; color:var(--muted); background:var(--card); border:1px solid var(--line); cursor:pointer;}
  .tab.active{background:var(--primary); color:#fff; border-color:var(--primary);}

  main{padding:14px 16px;}

  .task-card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px; margin-bottom:10px;}
  .tc-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .tc-name{font-size:13.5px; font-weight:700;}
  .tc-meta{font-size:11.5px; color:var(--muted); margin-top:3px;}
  .badge{font-size:10.5px; font-weight:700; padding:3px 10px; border-radius:20px; flex-shrink:0;}
  .badge.approved{background:#DCFCE7; color:#166534;}
  .badge.rejected{background:rgba(220,38,38,.1); color:var(--danger);}
  .badge.needs_review{background:#EEF3FF; color:var(--primary);}
  .reward{font-size:13px; font-weight:800; color:var(--secondary); margin-top:8px;}

  .dispute-btn{
    margin-top:10px; width:100%; background:#fff; color:var(--primary); border:1px solid var(--primary);
    padding:9px; border-radius:9px; font-weight:700; font-size:12px; cursor:pointer;
  }
  .dispute-status{
    margin-top:10px; font-size:12px; padding:8px 10px; border-radius:8px; background:var(--neutral); color:var(--secondary); font-weight:600;
  }

  .empty{color:var(--muted); font-size:13px; text-align:center; padding:30px 10px;}

  .modal-backdrop{position:fixed; inset:0; background:rgba(14,42,107,0.5); display:flex; align-items:flex-end; z-index:30;}
  .modal-backdrop.hidden{display:none;}
  .modal{background:#fff; border-radius:18px 18px 0 0; padding:20px 18px 24px; width:100%; max-width:420px; margin:0 auto;}
  .modal h3{margin:0 0 6px; font-size:15px;}
  .modal p{margin:0 0 14px; font-size:12.5px; color:var(--muted);}
  .modal textarea{width:100%; min-height:80px; border:1px solid var(--line); border-radius:9px; padding:10px; font-size:13px; box-sizing:border-box; font-family:inherit;}
  .modal-actions{display:flex; gap:8px; margin-top:12px;}
  .modal-actions button{flex:1; padding:11px; border-radius:9px; font-weight:700; font-size:13px; cursor:pointer;}
  .modal-actions .cancel{background:var(--neutral); border:1px solid var(--line); color:var(--text);}
  .modal-actions .submit{background:var(--primary); border:none; color:#fff;}
  .hidden{display:none;}
</style>
<link rel="stylesheet" href="assets/qapela-theme.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute">
<defs><symbol id="i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol></defs>
</svg>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="topbar-row">
      <span class="back" onclick="history.back()"><svg class="ic"><use href="#i-back"/></svg></span>
      <div class="brand">
        <div class="logo-mark"><img class="qapela-logo-img" src="assets/qapela-logo-icon.png" alt="Qapela mark" style="width:15px;height:15px;"></div>
        My Tasks
      </div>
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" data-status="needs_review" onclick="setTab('needs_review')">Pending</div>
    <div class="tab" data-status="approved" onclick="setTab('approved')">Approved</div>
    <div class="tab" data-status="rejected" onclick="setTab('rejected')">Rejected</div>
  </div>

  <main>
    <div id="taskList"><div class="empty">Loading…</div></div>
  </main>
</div>

<div class="modal-backdrop hidden" id="disputeModal">
  <div class="modal">
    <h3>Raise a Dispute</h3>
    <p>Tell us why you think this submission should be reconsidered. Include any evidence links if you have them.</p>
    <textarea id="disputeText" placeholder="e.g. I completed the task correctly, here's a link to proof: ..."></textarea>
    <div class="modal-actions">
      <button class="cancel" onclick="closeDisputeModal()">Cancel</button>
      <button class="submit" onclick="submitDispute()">Submit Dispute</button>
    </div>
  </div>
</div>

<script>
  const API_BASE = "https://capella-api-5c6c.drthankgod08.workers.dev";

  let currentTab = "needs_review";
  let disputedSubmissionIds = new Set();
  let pendingDisputeSubmissionId = null;

  async function apiFetch(path, options = {}) {
    const res = await fetch(API_BASE + path, {
      ...options,
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + localStorage.getItem("qapela_token"), ...(options.headers || {}) },
    });
    const renewed = res.headers.get("X-Renewed-Token");
    if (renewed) localStorage.setItem("qapela_token", renewed);
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, data };
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, s => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[s]));
  }
  function formatDate(iso) {
    if (!iso) return "—";
    return new Date(iso).toLocaleDateString('en-NG', { day: '2-digit', month: 'short' });
  }

  async function init() {
    const token = localStorage.getItem("qapela_token");
    if (!token) { window.location.href = "qapela-login.html"; return; }

    const me = await apiFetch("/auth/me");
    if (!me.ok) {
      localStorage.removeItem("qapela_token");
      window.location.href = "qapela-login.html";
      return;
    }

    document.getElementById("app").classList.remove("hidden");
    await loadDisputes();
    loadTab();
  }

  async function loadDisputes() {
    const { data } = await apiFetch("/disputes/mine");
    disputedSubmissionIds = new Set(data.disputedSubmissionIds || []);
  }

  window.setTab = function (status) {
    currentTab = status;
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.status === status));
    loadTab();
  };

  async function loadTab() {
    const listEl = document.getElementById("taskList");
    listEl.innerHTML = '<div class="empty">Loading…</div>';

    const { ok, data } = await apiFetch("/submissions/mine?status=" + encodeURIComponent(currentTab));
    if (!ok) { listEl.innerHTML = `<div class="empty">Could not load: ${escapeHtml(data.message || "")}</div>`; return; }

    const rows = data.submissions || [];
    if (rows.length === 0) {
      const label = currentTab === "needs_review" ? "pending" : currentTab;
      listEl.innerHTML = `<div class="empty">No ${label} tasks.</div>`;
      return;
    }
    listEl.innerHTML = rows.map(renderCard).join("");
  }

  function renderCard(s) {
    let actionHtml = "";
    if (s.status === "rejected") {
      actionHtml = disputedSubmissionIds.has(s.id)
        ? `<div class="dispute-status">Dispute submitted — under review</div>`
        : `<button class="dispute-btn" onclick="openDisputeModal('${s.id}')">Raise a Dispute</button>`;
    }
    const reward = Number(s.workerRewardSnapshot || 0);
    return `
      <div class="task-card">
        <div class="tc-top">
          <div>
            <div class="tc-name">${escapeHtml(s.taskName || s.taskTypeId || 'Task')}</div>
            <div class="tc-meta">${escapeHtml(s.taskCategory || "")} · ${formatDate(s.createdAt)}</div>
          </div>
          <span class="badge ${s.status}">${escapeHtml((s.status || '').replace(/_/g, ' '))}</span>
        </div>
        ${reward ? `<div class="reward">₦${reward}${s.status === 'approved' ? ' · paid' : ''}</div>` : ''}
        ${actionHtml}
      </div>
    `;
  }

  window.openDisputeModal = function (submissionId) {
    pendingDisputeSubmissionId = submissionId;
    document.getElementById("disputeText").value = "";
    document.getElementById("disputeModal").classList.remove("hidden");
  };
  window.closeDisputeModal = function () {
    document.getElementById("disputeModal").classList.add("hidden");
    pendingDisputeSubmissionId = null;
  };

  window.submitDispute = async function () {
    const text = document.getElementById("disputeText").value.trim();
    if (!text) return;

    const { ok, data } = await apiFetch("/disputes", {
      method: "POST",
      body: JSON.stringify({ relatedId: pendingDisputeSubmissionId, reason: text }),
    });

    if (ok && data.success) {
      disputedSubmissionIds.add(pendingDisputeSubmissionId);
      closeDisputeModal();
      loadTab();
    } else {
      alert("Could not submit dispute: " + (data.message || ""));
    }
  };

  init();
</script>

<script src="assets/qapela-help.js" defer></script>
<script src="assets/qapela-verify.js" defer></script>
</body>
</html>
