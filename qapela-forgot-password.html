<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<link rel="apple-touch-icon" href="assets/qapela-logo-icon.png">

<meta property="og:image" content="https://ejitechx.github.io/qapela-worker/assets/qapela-share.jpg">
<meta property="og:image:type" content="image/jpeg">

<script src="assets/qapela-session.js"></script>
<title>Qapela — Forgot Password</title>
<style>
  :root{
    --primary:#0B5CFF; --secondary:#0E2A6B; --accent:#F5B301; --neutral:#F8FAFF;
    --text:#1B2559; --muted:#6B7590; --line:#E6EAF2; --green:#16A34A; --danger:#DC2626;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--neutral); color:var(--text); font-family:'Segoe UI',system-ui,-apple-system,sans-serif; max-width:420px; margin-left:auto; margin-right:auto; min-height:100vh; display:flex; flex-direction:column;}
  svg.ic{width:1em; height:1em; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vertical-align:-0.15em;}

  header{background:var(--secondary); padding:18px; display:flex; align-items:center; gap:10px;}
  .back{color:#fff; font-size:19px; cursor:pointer; text-decoration:none;}
  .brand{display:flex; align-items:center; gap:9px; font-weight:800; font-size:15px; color:#fff;}
  .logo-mark{width:24px; height:24px; border-radius:6px; flex-shrink:0; background:linear-gradient(135deg,var(--primary),var(--accent));}

  main{flex:1; padding:30px 24px;}
  .icon-badge{width:52px; height:52px; border-radius:50%; background:#EEF3FF; color:var(--primary); display:flex; align-items:center; justify-content:center; margin-bottom:18px;}
  h1{font-size:19px; margin:0 0 8px;}
  .sub{font-size:13.5px; color:var(--muted); margin:0 0 24px; line-height:1.5;}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; font-weight:700; margin-bottom:6px;}
  .field input{width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:10px; font-size:14px; box-sizing:border-box;}

  .btn{width:100%; background:var(--primary); color:#fff; border:none; padding:13px; border-radius:11px; font-weight:700; font-size:14px; cursor:pointer;}
  .btn:disabled{background:var(--line); color:var(--muted);}

  .result-box{text-align:center; padding:20px 10px;}
  .result-icon{width:56px; height:56px; border-radius:50%; background:#DCFCE7; color:var(--green); display:flex; align-items:center; justify-content:center; margin:0 auto 16px;}
  .result-box h2{font-size:17px; margin:0 0 8px;}
  .result-box p{font-size:13.5px; color:var(--muted); line-height:1.5;}

  .msg{font-size:12.5px; margin-top:10px; color:var(--danger);}
  .back-link{display:block; text-align:center; margin-top:20px; font-size:13px; color:var(--primary); text-decoration:none; font-weight:600;}
  .hidden{display:none;}
  .qapela-wordmark{height:30px; width:auto; display:block;}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
<defs>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
</defs>
</svg>

<header>
  <a class="back" onclick="history.back()"><svg class="ic"><use href="#i-back"/></svg></a>
  <div class="brand"><img class="qapela-wordmark" src="assets/qapela-wordmark.png" alt="Qapela"></div>
</header>

<main>
  <div id="formView">
    <div class="icon-badge"><svg class="ic" style="width:22px;height:22px;"><use href="#i-lock"/></svg></div>
    <h1>Forgot your password?</h1>
    <div class="sub">Enter the email on your account and we'll send you a link to set a new one.</div>

    <div class="field"><label>Email</label><input type="email" id="f-email" placeholder="you@example.com"></div>
    <button class="btn" id="sendBtn" onclick="sendReset()">Send Reset Link</button>
    <div class="msg" id="formMsg"></div>
  </div>

  <div id="resultView" class="result-box hidden">
    <div class="result-icon"><svg class="ic" style="width:26px;height:26px;"><use href="#i-mail"/></svg></div>
    <h2>Check your email</h2>
    <p>If an account exists for that email, a reset link is on its way. It stays valid for 24 hours.</p>
  </div>

  <a class="back-link" href="qapela-login.html">Back to Sign In</a>
</main>

<script src="assets/qapela-verify.js" defer></script>
<script>
  const API_BASE = "https://capella-api-5c6c.drthankgod08.workers.dev";

  window.sendReset = async function () {
    const email = document.getElementById("f-email").value.trim();
    const msgEl = document.getElementById("formMsg");
    msgEl.textContent = "";

    if (!email || !email.includes("@")) { msgEl.textContent = "Enter a valid email address."; return; }

    const btn = document.getElementById("sendBtn");
    btn.disabled = true;
    btn.textContent = "Sending…";

    try {
      const res = await fetch(API_BASE + "/auth/password-reset/request", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email }),
      });
      const data = await res.json();

      if (res.ok && data.success) {
        document.getElementById("formView").classList.add("hidden");
        document.getElementById("resultView").classList.remove("hidden");
        if (data.queued) {
          // Today's reset emails are all used up: tell them plainly it arrives tomorrow.
          document.querySelector("#resultView h2").textContent = "Your email is queued";
          document.querySelector("#resultView p").textContent = data.message;
          window.qapelaPopup("Your reset email will arrive tomorrow", data.message);
        }
      } else {
        msgEl.textContent = data.message || "Something went wrong. Try again.";
        btn.disabled = false;
        btn.textContent = "Send Reset Link";
      }
    } catch (err) {
      msgEl.textContent = "Could not reach the server. Check your connection.";
      btn.disabled = false;
      btn.textContent = "Send Reset Link";
    }
  };
</script>

<script src="assets/qapela-help.js" defer></script>
</body>
</html>
