<title>Qapela — Wallet</title>
<style>
  :root{
    --primary:#0B5CFF; --secondary:#0E2A6B; --accent:#F5B301; --neutral:#F8FAFF;
    --bg:#F8FAFF; --card:#FFFFFF; --line:#E6EAF2;
    --text:#1B2559; --muted:#6B7590; --green:#16A34A; --danger:#DC2626;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,-apple-system,sans-serif; max-width:420px; margin-left:auto; margin-right:auto; min-height:100vh; padding-bottom:24px;}
  svg.ic{width:1em; height:1em; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vertical-align:-0.15em;}

  header.topbar{background:var(--secondary); color:#fff; padding:16px 18px 20px; border-radius:0 0 20px 20px;}
  .topbar-row{display:flex; align-items:center; gap:10px;}
  .back{font-size:19px; color:#fff; cursor:pointer;}
  .brand{display:flex; align-items:center; gap:9px; font-weight:800; font-size:16px;}
  .logo-mark{width:26px; height:26px; border-radius:7px; flex-shrink:0; background:linear-gradient(135deg,var(--primary),var(--accent)); display:flex; align-items:center; justify-content:center;}

  main{padding:16px;}

  .balance-card{background:linear-gradient(135deg,var(--primary),var(--secondary)); color:#fff; border-radius:16px; padding:18px; margin-bottom:14px;}
  .balance-card .label{font-size:11.5px; opacity:.9; font-weight:600;}
  .balance-card .amount{font-size:28px; font-weight:800; margin-top:6px;}
  .balance-card .sub-row{display:flex; justify-content:space-between; margin-top:14px; font-size:11.5px; opacity:.9;}
  .withdraw-btn{width:100%; background:var(--accent); color:#3A2900; border:none; padding:11px; border-radius:10px; font-weight:700; font-size:13px; cursor:pointer; margin-top:14px;}

  .breakdown-card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px;}
  .breakdown-card h2{font-size:13.5px; margin:0 0 12px; font-weight:700;}
  .b-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .b-row:last-child{border-bottom:none;}
  .b-label{display:flex; align-items:center; gap:8px; color:var(--muted); font-weight:600;}
  .b-dot{width:8px; height:8px; border-radius:50%;}
  .b-value{font-weight:700;}

  .section-head{font-size:14px; font-weight:700; margin:4px 2px 10px;}
  .tx-card{background:var(--card); border:1px solid var(--line); border-radius:13px; padding:12px 14px; margin-bottom:9px; display:flex; justify-content:space-between; align-items:center;}
  .tx-type{font-size:13px; font-weight:700; text-transform:capitalize;}
  .tx-date{font-size:11px; color:var(--muted); margin-top:2px;}
  .tx-amount{font-weight:800; font-size:13.5px;}
  .tx-amount.credit{color:var(--green);}
  .tx-amount.debit{color:var(--danger);}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:24px 0;}
  .hidden{display:none;}
</style>
<link rel="stylesheet" href="assets/qapela-theme.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute">
<defs><symbol id="i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol></defs>
</svg>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="topbar-row">
      <span class="back" onclick="history.back()"><svg class="ic"><use href="#i-back"/></svg></span>
      <div class="brand">
        <div class="logo-mark"><img class="qapela-logo-img" src="assets/qapela-logo-icon.png" alt="Qapela mark" style="width:15px;height:15px;"></div>
        Wallet
      </div>
    </div>
  </header>

  <main>
    <div class="balance-card">
      <div class="label">Available Balance</div>
      <div class="amount" id="availBal">₦0.00</div>
      <div class="sub-row">
        <span>Pending: <strong id="pendingBal">₦0.00</strong></span>
        <span>Total Earned: <strong id="totalBal">₦0.00</strong></span>
      </div>
      <button class="withdraw-btn" onclick="window.location.href='qapela-withdrawal.html'">Withdraw</button>
    </div>

    <div class="breakdown-card">
      <h2>Earnings Breakdown</h2>
      <div class="b-row"><div class="b-label"><span class="b-dot" style="background:#0B5CFF"></span>Task Earnings</div><div class="b-value" id="bTask">₦0</div></div>
      <div class="b-row"><div class="b-label"><span class="b-dot" style="background:#16A34A"></span>Referral Commissions</div><div class="b-value" id="bReferral">₦0</div></div>
      <div class="b-row"><div class="b-label"><span class="b-dot" style="background:#F5B301"></span>Affiliate Commissions</div><div class="b-value" id="bAffiliate">₦0</div></div>
      <div class="b-row"><div class="b-label"><span class="b-dot" style="background:#EC4899"></span>Music Sales</div><div class="b-value" id="bMusic">₦0</div></div>
      <div class="b-row"><div class="b-label"><span class="b-dot" style="background:#7C3AED"></span>Bonuses</div><div class="b-value" id="bBonus">₦0</div></div>
    </div>

    <div class="section-head">Transaction History</div>
    <div id="txList"><div class="empty">Loading…</div></div>
  </main>
</div>

<script>
  const API_BASE = "https://capella-api-5c6c.drthankgod08.workers.dev";

  async function apiFetch(path, options = {}) {
    const res = await fetch(API_BASE + path, {
      ...options,
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + localStorage.getItem("qapela_token"), ...(options.headers || {}) },
    });
    const renewed = res.headers.get("X-Renewed-Token");
    if (renewed) localStorage.setItem("qapela_token", renewed);
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, data };
  }

  function nairaFmt(n) { return "₦" + Number(n || 0).toLocaleString(); }
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, s => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[s]));
  }
  function formatDate(iso) {
    if (!iso) return "—";
    return new Date(iso).toLocaleDateString('en-NG', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  async function init() {
    const token = localStorage.getItem("qapela_token");
    if (!token) { window.location.href = "qapela-login.html"; return; }

    const me = await apiFetch("/auth/me");
    if (!me.ok) {
      localStorage.removeItem("qapela_token");
      window.location.href = "qapela-login.html";
      return;
    }

    document.getElementById("app").classList.remove("hidden");
    loadWallet();
    loadHistory();
  }

  async function loadWallet() {
    const { data } = await apiFetch("/wallet/mine");
    document.getElementById("availBal").textContent = nairaFmt(data.availableBalance);
    document.getElementById("pendingBal").textContent = nairaFmt(data.pendingBalance);
    document.getElementById("totalBal").textContent = nairaFmt(data.totalEarned);

    document.getElementById("bTask").textContent = nairaFmt(data.breakdownTaskEarnings);
    document.getElementById("bReferral").textContent = nairaFmt(data.breakdownReferralCommissions);
    document.getElementById("bAffiliate").textContent = nairaFmt(data.breakdownAffiliateEarnings);
    document.getElementById("bMusic").textContent = nairaFmt(data.breakdownMusicSales);
    document.getElementById("bBonus").textContent = nairaFmt(data.breakdownBonuses);
  }

  async function loadHistory() {
    const { ok, data } = await apiFetch("/wallet/transactions");
    const el = document.getElementById("txList");
    if (!ok) { el.innerHTML = `<div class="empty">Could not load transactions.</div>`; return; }

    const rows = data.transactions || [];
    if (rows.length === 0) { el.innerHTML = '<div class="empty">No transactions yet.</div>'; return; }

    el.innerHTML = rows.map(t => `
      <div class="tx-card">
        <div>
          <div class="tx-type">${escapeHtml((t.type || '').replace(/_/g, ' '))}</div>
          <div class="tx-date">${formatDate(t.createdAt)}</div>
        </div>
        <div class="tx-amount ${t.amount >= 0 ? 'credit' : 'debit'}">${t.amount >= 0 ? '+' : ''}${nairaFmt(t.amount)}</div>
      </div>
    `).join("");
  }

  init();
</script>

<script src="assets/qapela-help.js" defer></script>
<script src="assets/qapela-verify.js" defer></script>
</body>
</html>
